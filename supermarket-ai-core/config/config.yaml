# Central tuning file. No threshold may be hard-coded in src/.

# Minimum YOLO confidence for a detection to enter the pipeline.
DETECTION_CONFIDENCE: 0.45

# Cosine similarity above which two embeddings are considered the same person.
REID_SIMILARITY_THRESHOLD: 0.70

# Seconds a global identity is retained after its last sighting before expiry.
GLOBAL_ID_TIMEOUT: 300

# Seconds a global identity stays in the SEARCHING state while waiting to
# reappear on a downstream camera.
GLOBAL_ID_SEARCH_TIMEOUT: 60

# Minimum confidence for a behaviour event to be emitted for human review.
EVENT_CONFIDENCE_THRESHOLD: 0.60

# Target processing rate per camera.
TRACKING_FPS: 15

# Process 1 frame out of every (FRAME_SKIP + 1). 0 = process every frame.
FRAME_SKIP: 1

# Frames are resized to this resolution before inference.
# Set ENABLED to false to keep each video at its native resolution.
VIDEO_RESOLUTION:
  ENABLED: true
  width: 1280
  height: 720

# Detection model (M1).
MODEL:
  # Downloaded automatically by ultralytics if only a name is given; place a
  # local checkpoint under models/ to avoid network access. See models/README.md.
  WEIGHTS: yolov8n.pt
  # "auto" lets torch choose; otherwise "cpu", "cuda", "cuda:0", "mps".
  DEVICE: auto
  # Empty list = keep every class the pretrained model supports.
  # Example: ["person", "bottle", "backpack", "handbag"]
  CLASSES: []

# Multi-object tracking (M2). Ids are camera-local and temporary.
TRACKING:
  # Always track, without passing --track on the command line.
  ENABLED: false
  # bytetrack | botsort (Ultralytics), or iou for the dependency-free fallback.
  TRACKER: bytetrack
  # IoU fallback only: association threshold, frames a track survives unmatched,
  # and matches required before a track is reported.
  MIN_IOU: 0.3
  MAX_AGE: 30
  MIN_HITS: 1

# Output artefacts (M1 detection, M2 tracking).
OUTPUT:
  DIR: output
  ANNOTATED_VIDEO: true
  JSON: true
  VIDEO_CODEC: mp4v
  # Emit a progress log line every N processed frames.
  LOG_EVERY: 50
